<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>ISS (International Space Station) Tracker</title>
</head>
<body>

  <h2>ISS TRACKER</h2>
  <p class="header-para">Live location & status of the International Space Station (ISS)</p>
    <div class="left">
      <img src="images/international-space.avif" alt="">
    </div>

    <div class="right">
      <div class="nav-box">
        <div class="nav-right box1">
           <div class="spna">
            <p class="icon">📍</p>
           </div>
        <div class="nav-para">
          <p class="para">Latitude</p>
        <p class="para1 para10"></p>
        </div>
      </div>
      <div class="nav-right box1">
        <div class="spna">
            <p>🌍</p>
           </div>
           <div class="nav-para">
            <p>Longitude</p>
        <p class="para2 para10"></p>
           </div>
      </div>

      <div class="nav-right box1">
        <div class="spna">
            <p>🕒</p>
           </div>
        <div class="nav-para">
          <p>Timestamp</p>
        <p class="para3 para10"></p>
        </div>
      </div>
      </div>
    </div> 

    <div class="right">
      <div class="nav-box">
        <div class="nav-right box1">
         <div class="spna">
            <p>⚡</p>
           </div>
        <div class="nav-para">
          <p class="para">Velocity</p>
        <p class="para5 para10"></p>
        </div>
      </div>

      <div class="nav-right box1">
        <div class="spna">
            <p>👁️</p>
           </div>
        <div class="nav-para">
          <p>Visibility</p>
        <p class="para6 para10"></p>
        </div>
      </div>

      <div class="nav-right box1">
        <div class="spna">
            <p>🎯</p>
           </div>
        <div class="nav-para">
          <p>Footprint</p>
        <p class="para7 para10"></p>
        </div>
      </div>
      </div>
    </div> 

 <div class="right">
      <div class="nav-box">
        <div class="nav-right box1">

          <div class="spna">
            <p>⛰️</p>
           </div>
        <div class="nav-para">
          <p class="para">Altitude</p>
        <p class="para4 para10"></p>
        </div>
      </div>

      <div class="nav-right box1">
        <div class="spna">
            <p>☀️</p>
           </div>
        <div class="nav-para">
          <p>Solar Latitude</p>
        <p class="para8 para10"></p>
        </div>
      </div>

      <div class="nav-right box1">
        <div class="spna">
            <p>🌞</p>
           </div>
        <div class="nav-para">
          <p>Solar Longitude</p>
        <p class="para9 para10"></p>
        </div>
      </div>
      <!-- </div> -->
    </div> 
  </div>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
  <script src="apps.js"></script>
</body>
</html>
